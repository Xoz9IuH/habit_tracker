<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Трекер привычек — учебное приложение учёта привычек, целей и отметок о выполнении.">
  <meta name="theme-color" content="#3F51B5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Трекер привычек">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Трекер привычек</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f6fa;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f5f6fa;
      color: #303f9f;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash h1 { margin: 0; font-size: 26px; font-weight: 600; }
    #splash p { margin: 0; font-size: 14px; color: #6b7280; }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #c5cae9;
      border-top-color: #303f9f;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #splash.failed .spinner { display: none; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #error {
      display: none;
      max-width: 460px;
      padding: 16px 20px;
      background: #fff;
      border-left: 4px solid #c62828;
      border-radius: 6px;
      color: #374151;
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
    }
    #splash.failed #error { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121212; }
      #splash { background: #121212; color: #c5cae9; }
      #splash p { color: #9ca3af; }
      #error { background: #1f2937; color: #e5e7eb; }
    }
    @media (max-width: 599px) {
      #splash h1 { font-size: 20px; }
      #splash .spinner { width: 30px; height: 30px; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="spinner"></div>
    <h1>Трекер привычек</h1>
    <p id="status">Загружаем приложение…</p>
    <div id="error">
      Приложение не загрузилось. Сервер не отвечает — проверьте соединение
      и обновите страницу.
    </div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var status = document.getElementById('status');

      function hideSplash() {
        if (!splash || splash.classList.contains('hidden')) return;
        splash.classList.add('hidden');
        window.setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }

      function fail(text) {
        if (!splash) return;
        splash.classList.add('failed');
        status.textContent = text || 'Сервер приложения не отвечает';
      }

      window.addEventListener('flutter-first-frame', hideSplash);
      window.addEventListener('load', function () {
        window.setTimeout(hideSplash, 4000);
      });
      window.setTimeout(function () {
        if (!splash || splash.classList.contains('hidden')) return;
        status.textContent = 'Это дольше обычного — ещё немного подождите…';
      }, 8000);
      window.setTimeout(function () {
        if (splash && !splash.classList.contains('hidden')) fail();
      }, 25000);

      window.habitTrackerSplash = { hide: hideSplash, fail: fail };
    })();
  </script>

  <script src="pr6.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
