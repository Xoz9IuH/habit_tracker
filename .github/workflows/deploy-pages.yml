name: Deploy to GitHub Pages

on:
  push:
    branches: [pr6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze

      - name: Форматирование
        run: dart format --set-exit-if-changed lib test

      - name: Тесты
        run: flutter test --reporter expanded

      - name: Сборка JavaScript
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /habit_tracker/
          du -sh build/web
          cp -r build/web build/web-js
          cp build/web/index.html build/web/404.html

      - name: Сборка WebAssembly
        run: |
          flutter build web --release --wasm --base-href /habit_tracker/
          du -sh build/web
          cp build/web/index.html build/web/404.html
          mkdir -p build/web-wasm
          cp -r build/web/* build/web-wasm/ 2>/dev/null || true

      - name: Итоговые размеры
        run: |
          echo "js: $(du -sh build/web-js | cut -f1)"
          echo "wasm: $(du -sh build/web-wasm | cut -f1)"
          echo "main.dart.js: $(du -h build/web-js/main.dart.js | cut -f1)"

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          retention-days: 1

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
