name: Deploy to GitHub Pages

on:
  push:
    branches: [pr6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze

      - name: Форматирование
        run: dart format --set-exit-if-changed lib test

      - name: Тесты
        run: flutter test --reporter expanded

      - name: Сборка JavaScript
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /habit_tracker/
          du -sh build/web
          mkdir -p build/web-js
          cp -r build/web/* build/web-js/
          cp build/web/index.html build/web/404.html

      - name: Сборка WebAssembly
        run: |
          flutter build web --release --wasm --base-href /habit_tracker/
          du -sh build/web
          mkdir -p build/web-wasm
          cp -r build/web/* build/web-wasm/
          echo "wasm готов"

      - name: Итоговые размеры
        run: |
          echo "js: $(du -sh build/web-js | cut -f1)"
          echo "js main.dart.js: $(du -h build/web-js/main.dart.js | cut -f1)"
          echo "wasm: $(du -sh build/web-wasm | cut -f1)"

      - name: Опубликовать на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Публикация сборки ${{ github.sha }}'

  pages-check:
    name: Проверка ответа
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Подождать публикацию
        run: sleep 60

      - name: Проверить страницу
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Проверяем $URL"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")
            echo "попытка $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              BODY=$(curl -sL "$URL")
              echo "$BODY" | grep -q "Трекер привычек" && echo "Страница приложения доступна"
              exit 0
            fi
            sleep 15
          done
          echo "Страница пока недоступна"
          exit 0
