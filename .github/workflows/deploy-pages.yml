name: Deploy to GitHub Pages

on:
  push:
    branches: [pr6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ
        run: flutter analyze

      - name: Форматирование
        run: dart format --set-exit-if-changed lib test

      - name: Тесты
        run: flutter test --reporter expanded

      - name: Сборка JavaScript
        run: |
          flutter build web --release --no-wasm-dry-run --base-href /habit_tracker/
          du -sh build/web
          mkdir -p build/web-js
          cp -r build/web/* build/web-js/
          cp build/web/index.html build/web/404.html
          find build/web -name "*.symbols" -delete

      - name: Сборка WebAssembly
        run: |
          flutter build web --release --wasm --base-href /habit_tracker/
          du -sh build/web
          mkdir -p build/web-wasm
          cp -r build/web/* build/web-wasm/
          cp build/web/index.html build/web/404.html

      - name: Размер сборки
        run: |
          echo "js: $(du -sh build/web-js | cut -f1)"
          echo "wasm: $(du -sh build/web-wasm | cut -f1)"
          du -h build/web-js/main.dart.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          retention-days: 1

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
